<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 300"
     width="1000" height="300"
     role="img"
     aria-labelledby="t d">

  <title id="t">Luis Diego Sipion Galvez</title>
  <desc id="d">Estudiante de Ingeniería de Software con IA y Ciberseguridad</desc>

  <defs>
    <!-- DEGRADADOS -->
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <radialGradient id="g1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="g2">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- COLORES DEL CUBO (AZUL) -->
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1685D5"/>
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#174BD9"/>
      <stop offset="100%" stop-color="#3535C5"/>
    </linearGradient>

    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28C7DF"/>
      <stop offset="100%" stop-color="#35B6D0"/>
    </linearGradient>

    <!-- FONDO -->
    <pattern id="dots" width="24" height="24"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1000" height="300" rx="18"/>
    </clipPath>

    <!-- FILTRO DE BRILLO PARA LA LUZ -->
    <filter id="lightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <style>
    .sans {
      font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .typed {
      font-size: 22px;
      fill: #C9D1D9;
    }

    .blink {
      animation: bl 1s steps(1,end) infinite;
    }

    @keyframes bl {
      50% { opacity: 0; }
    }

    .grow {
      animation: gr 1.6s ease-out forwards;
      transform-origin: 64px 0;
      transform: scaleX(0);
    }

    @keyframes gr {
      to { transform: scaleX(1); }
    }

    @keyframes r0 {
      0% { width: 0; animation-timing-function: steps(38,end); }
      12.67%, 26.67% { width: 509.4px; animation-timing-function: steps(38,end); }
      31.67%, 100% { width: 0; }
    }

    @keyframes c0 {
      0% { transform: translateX(0); opacity: 1; animation-timing-function: steps(38,end); }
      12.67%, 26.67% { transform: translateX(509.4px); opacity: 1; animation-timing-function: steps(38,end); }
      31.67% { transform: translateX(0); opacity: 1; }
      31.68%, 100% { transform: translateX(0); opacity: 0; }
    }

    .r0 { animation: r0 12s infinite; }
    .c0 { animation: c0 12s infinite; }

    @keyframes r1 {
      0%, 33.33% { width: 0; animation-timing-function: steps(36,end); }
      46%, 60% { width: 482.8px; animation-timing-function: steps(36,end); }
      65%, 100% { width: 0; }
    }

    @keyframes c1 {
      0%, 33.33% { transform: translateX(0); opacity: 0; animation-timing-function: steps(36,end); }
      33.34% { transform: translateX(0); opacity: 1; animation-timing-function: steps(36,end); }
      46%, 60% { transform: translateX(482.8px); opacity: 1; animation-timing-function: steps(36,end); }
      65% { transform: translateX(0); opacity: 1; }
      65.01%, 100% { transform: translateX(0); opacity: 0; }
    }

    .r1 { animation: r1 12s infinite; }
    .c1 { animation: c1 12s infinite; }

    @keyframes r2 {
      0%, 66.67% { width: 0; animation-timing-function: steps(35,end); }
      79.33%, 93.33% { width: 469.5px; animation-timing-function: steps(35,end); }
      98.33%, 100% { width: 0; }
    }

    @keyframes c2 {
      0%, 66.67% { transform: translateX(0); opacity: 0; animation-timing-function: steps(35,end); }
      66.68% { transform: translateX(0); opacity: 1; animation-timing-function: steps(35,end); }
      79.33%, 93.33% { transform: translateX(469.5px); opacity: 1; animation-timing-function: steps(35,end); }
      98.33% { transform: translateX(0); opacity: 1; }
      98.34%, 100% { transform: translateX(0); opacity: 0; }
    }

    .r2 { animation: r2 12s infinite; }
    .c2 { animation: c2 12s infinite; }

    .cube-float {
      animation: cubeFloat 4s ease-in-out infinite;
    }

    @keyframes cubeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .grow { transform: none; }
    }
  </style>

  <!-- FONDO PRINCIPAL -->
  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="#0D1117"/>
    <rect width="1000" height="300" fill="url(#dots)"/>

    <circle cx="820" cy="60" r="240" fill="url(#g1)">
      <animate attributeName="cx" values="820;760;820" dur="14s" repeatCount="indefinite"/>
    </circle>

    <circle cx="120" cy="300" r="260" fill="url(#g2)">
      <animate attributeName="cy" values="300;250;300" dur="11s" repeatCount="indefinite"/>
    </circle>

    <rect x=".75" y=".75"
          width="998.5" height="298.5"
          rx="17.5"
          fill="none"
          stroke="#30363D"
          stroke-width="1.5"/>
  </g>

  <!-- PRESENTACIÓN -->
  <text class="mono" x="64" y="72" font-size="18" fill="#8B949E">
    hola, soy
  </text>

  <text class="sans"
        x="62" y="134"
        font-size="60"
        font-weight="700"
        fill="#F0F6FC"
        letter-spacing="-1">
    Luis Diego Sipion Galvez
  </text>

  <!-- LÍNEA ANIMADA -->
  <rect class="grow"
        x="64" y="152"
        width="150" height="4"
        rx="2"
        fill="url(#bar)"/>

  <!-- TERMINAL -->
  <text class="mono" x="64" y="214" font-size="22" fill="#8B5CF6">
    ❯
  </text>

  <!-- PRIMER TEXTO -->
  <clipPath id="clip0">
    <rect class="r0" x="104" y="190" width="509.4" height="34"/>
  </clipPath>

  <text class="mono typed" x="104" y="214" clip-path="url(#clip0)">
    ingeniería de software IA y Ciberseguridad
  </text>

  <g class="c0">
    <rect class="blink" x="106" y="195" width="11" height="24" fill="#22D3EE"/>
  </g>

  <!-- SEGUNDO TEXTO -->
  <clipPath id="clip1">
    <rect class="r1" x="104" y="190" width="482.8" height="34"/>
  </clipPath>

  <text class="mono typed" x="104" y="214" clip-path="url(#clip1)">
    web · bases de datos · deep learning
  </text>

  <g class="c1" opacity="0">
    <rect class="blink" x="106" y="195" width="11" height="24" fill="#22D
