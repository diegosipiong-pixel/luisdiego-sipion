
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 300"
     width="1000" height="300"
     role="img"
     aria-labelledby="titulo descripcion">

  <title id="titulo">Luis Diego Sipion Galvez</title>
  <desc id="descripcion">Estudiante de Ingeniería de Software, Inteligencia Artificial y Ciberseguridad</desc>

  <defs>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="brilloVioleta">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="brilloCian">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="caraSuperior" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42A5F5"/>
      <stop offset="1" stop-color="#1685D5"/>
    </linearGradient>

    <linearGradient id="caraIzquierda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174BD9"/>
      <stop offset="1" stop-color="#3535C5"/>
    </linearGradient>

    <linearGradient id="caraDerecha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28C7DF"/>
      <stop offset="1" stop-color="#168DAF"/>
    </linearGradient>

    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D"/>
    </pattern>

    <clipPath id="marco">
      <rect width="1000" height="300" rx="18"/>
    </clipPath>

    <clipPath id="recorteCubo">
      <path d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"/>
    </clipPath>

    <clipPath id="textoAnimado">
      <rect x="105" y="183" width="510" height="34">
        <animate attributeName="width"
          values="0;0;510;510;0;0;0;0;0;0;0"
          keyTimes="0;.02;.13;.27;.32;.34;.46;.60;.65;.79;1"
          dur="15s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: 'Segoe UI', Ubuntu, Arial, sans-serif;
    }

    .mono {
      font-family: 'Cascadia Code', Consolas, monospace;
    }

    .nombre {
      font-size: 52px;
      font-weight: 750;
      letter-spacing: -2px;
      fill: #F0F6FC;
    }

    .subtitulo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2.2px;
      fill: #8B949E;
    }

    .detalle {
      font-size: 12px;
      fill: #9DA7B3;
    }

    .flotar {
      animation: flotar 4s ease-in-out infinite;
    }

    @keyframes flotar {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .pulso {
      animation: pulso 3s ease-in-out infinite;
    }

    @keyframes pulso {
      0%,100% { opacity: .55; }
      50% { opacity: 1; }
    }

    .circuito {
      stroke-dasharray: 5 8;
      animation: moverCircuito 8s linear infinite;
    }

    @keyframes moverCircuito {
      to { stroke-dashoffset: -52; }
    }

    .luz {
      animation: recorrer 4s linear infinite;
    }

    @keyframes recorrer {
      to { stroke-dashoffset: -100; }
    }

    .cursor {
      animation: parpadear 1s steps(1,end) infinite;
    }

    @keyframes parpadear {
      50% { opacity: 0; }
    }

    .revelar {
      transform-box: fill-box;
      transform-origin: left;
      animation: revelar 1.2s ease-out both;
    }

    @keyframes revelar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>

  <!-- FONDO -->
  <g clip-path="url(#marco)">
    <rect width="1000" height="300" fill="#0B0F17"/>
    <rect width="1000" height="300" fill="url(#puntos)"/>

    <circle cx="820" cy="75" r="240" fill="url(#brilloVioleta)">
      <animate attributeName="cx" values="820;760;820"
        dur="14s" repeatCount="indefinite"/>
    </circle>

    <circle cx="120" cy="300" r="240" fill="url(#brilloCian)">
      <animate attributeName="cy" values="300;250;300"
        dur="11s" repeatCount="indefinite"/>
    </circle>

    <rect x=".75" y=".75" width="998.5" height="298.5"
      rx="17.5" fill="none" stroke="#30363D" stroke-width="1.5"/>

    <!-- CIRCUITOS SUTILES -->
    <g fill="none" stroke="#22D3EE"
       stroke-width="1.2" opacity=".13" class="circuit">
      <path d="M580 35 H650 V55 H705"/>
      <path d="M610 75 H675 V95 H730"/>
      <path d="M565 250 H630 V230 H690"/>
      <path d="M700 35 V20 H740"/>
      <path d="M690 270 H740 V250 H760"/>
      <circle cx="650" cy="35" r="3"/>
      <circle cx="705" cy="55" r="3"/>
      <circle cx="675" cy="75" r="3"/>
      <circle cx="630" cy="250" r="3"/>
    </g>
  </g>

  <!-- PRESENTACIÓN -->
  <text class="mono" x="66" y="57"
        font-size="14" fill="#22D3EE" letter-spacing="1.5">
    &lt; HOLA, SOY /&gt;
  </text>

  <text class="sans nombre" x="62" y="119">
    Luis Diego
  </text>

  <text class="sans" x="65" y="151"
        font-size="25" font-weight="650"
        fill="#DCE6F1" letter-spacing="1">
    SIPION GALVEZ
  </text>

  <!-- LÍNEA DE ACENTO -->
  <rect class="revelar" x="65" y="166"
        width="145" height="3" rx="2" fill="url(#acento)"/>

  <!-- TEXTO ANIMADO -->
  <text class="mono" x="65" y="207"
        font-size="21" fill="#8B5CF6">❯</text>

  <g class="mono" font-size="19" fill="#C9D1D9">
    <text x="103" y="207" clip-path="url(#textoAnimado)">
      Ingeniería de Software, IA y Ciberseguridad
    </text>
  </g>

  <rect class="cursor" x="105" y="188"
        width="3" height="23" rx="1" fill="#22D3EE">
    <animate attributeName="x"
      values="105;105;555;555;105;105;105;105;105"
      keyTimes="0;.02;.13;.27;.32;.34;.46;.60;1"
      dur="15s" repeatCount="indefinite"/>
  </rect>

  <!-- DESCRIPCIÓN -->
  <text class="mono detalle" x="65" y="232">
    Desarrollando soluciones · Aprendiendo · Innovando
  </text>

  <!-- ETIQUETAS -->
  <g class="mono" font-size="10" font-weight="600">

    <g transform="translate(65 248)">
      <rect width="158" height="25" rx="6"
        fill="#111D2B" stroke="#22D3EE" stroke-opacity=".45"/>
      <circle cx="13" cy="12.5" r="3" fill="#22D3EE"/>
      <text x="23" y="16" fill="#C9D1D9">INGENIERÍA DE SOFTWARE</text>
    </g>

    <g transform="translate(233 248)">
      <rect width="132" height="25" rx="6"
        fill="#111D2B" stroke="#8B5CF6" stroke-opacity=".5"/>
      <circle cx="13" cy="12.5" r="3" fill="#A855F7"/>
      <text x="23" y="16" fill="#C9D1D9">CIBERSEGURIDAD</text>
    </g>

    <g transform="translate(375 248)">
      <rect width="91" height="25" rx="6"
        fill="#111D2B" stroke="#3B82F6" stroke-opacity=".5"/>
      <circle cx="13" cy="12.5" r="3" fill="#3B82F6"/>
      <text x="23" y="16" fill="#C9D1D9">IA / ML</text>
    </g>

    <g transform="translate(476 248)">
      <rect width="111" height="25" rx="6"
        fill="#111D2B" stroke="#22D3EE" stroke-opacity=".35"/>
      <circle cx="13" cy="12.5" r="3" fill="#22D3EE"/>
      <text x="23" y="16" fill="#C9D1D9">DESARROLLADOR</text>
    </g>

  </g>

  <!-- UBICACIÓN -->
  <circle cx="69" cy="288" r="3" fill="#22C55E"/>
  <text class="mono" x="80" y="292"
        font-size="12" fill="#7D8997">
    Lima, Perú
  </text>

  <!-- SEPARADOR -->
  <path d="M620 45 V255" stroke="#30363D" stroke-width="1.2"/>

  <!-- ELEMENTOS TECNOLÓGICOS -->
  <g transform="translate(655 63)" class="pulso">
    <rect width="66" height="56" rx="10"
      fill="#111D2B" stroke="#22D3EE" stroke-opacity=".5"/>

    <path d="M25 17 L14 28 L25 39"
      fill="none" stroke="#22D3EE" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M41 17 L52 28 L41 39"
      fill="none" stroke="#A855F7" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M37 14 L29 42"
      fill="none" stroke="#FFFFFF" stroke-width="2.5"
      stroke-linecap="round"/>
  </g>

  <!-- ESCUDO DE CIBERSEGURIDAD -->
  <g transform="translate(678 142)" class="pulso">
    <path d="M30 0 L57 11 V31
      C57 49 45 62 30 70
      C15 62 3 49 3 31 V11 Z"
      fill="#111D2B" stroke="#8B5CF6" stroke-width="2.2"/>

    <path d="M30 8 L49 16 V31
      C49 44 41 53 30 61
      C19 53 11 44 11 31 V16 Z"
      fill="none" stroke="#22D3EE" stroke-width="1.4"/>

    <rect x="21" y="30" width="18" height="16"
      rx="3" fill="#22D3EE"/>

    <path d="M24 30 V25 C24 16 36 16 36 25 V30"
      fill="none" stroke="#FFFFFF" stroke-width="2.5"
      stroke-linecap="round"/>

    <circle cx="30" cy="37" r="2" fill="#0B0F17"/>
  </g>

  <!-- RED DE NODOS -->
  <g transform="translate(735 35)"
     fill="none" stroke="#22D3EE"
     stroke-width="1.4" opacity=".65">
    <path d="M0 20 L22 0 L44 20 L22 40 Z"/>
    <path d="M22 0 V40 M0 20 H44"/>
    <circle cx="22" cy="0" r="3" fill="#22D3EE"/>
    <circle cx="0" cy="20" r="3" fill="#22D3EE"/>
    <circle cx="44" cy="20" r="3" fill="#22D3EE"/>
    <circle cx="22" cy="40" r="3" fill="#22D3EE"/>
    <circle cx="22" cy="20" r="4" fill="#8B5CF6"/>
  </g>

  <!-- CUBO 3D -->
  <g transform="translate(760 78) scale(.35)">
    <g class="flotar">

      <path d="M257 17 L490 145 L257 273 L22 145 Z"
        fill="url(#caraSuperior)"/>

      <path d="M22 145 L257 273 L257 495 L22 369 Z"
        fill="url(#caraIzquierda)"/>

      <path d="M490 145 L257 273 L257 495 L490 369 Z"
        fill="url(#caraDerecha)"/>

      <!-- SÍMBOLO -->
      <g clip-path="url(#recorteCubo)">
        <g fill="none" stroke="#FFFFFF"
          stroke-width="27" stroke-linecap="round">
          <path d="M108 83 L219 145"/>
          <path d="M404 83 L294 145"/>
        </g>

        <ellipse cx="257" cy="163" rx="59" ry="34" fill="#FFFFFF"/>

        <ellipse cx="126" cy="313" rx="32" ry="56"
          transform="rotate(-28 126 313)" fill="#FFFFFF"/>

        <path d="M145 334 L257 398"
          fill="none" stroke="#FFFFFF" stroke-width="25"
          stroke-linecap="round"/>

        <ellipse cx="387" cy="313" rx="32" ry="56"
          transform="rotate(28 387 313)" fill="#FFFFFF"/>

        <path d="M367 334 L257 398"
          fill="none" stroke="#FFFFFF" stroke-width="25"
          stroke-linecap="round"/>
      </g>

      <!-- HALO -->
      <path d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none" stroke="#22D3EE" stroke-width="30"
        opacity=".2" pathLength="100"
        stroke-dasharray="22 78" class="luz">
        <animate attributeName="stroke-dashoffset"
          from="0" to="-100" dur="4s" repeatCount="indefinite"/>
      </path>

      <!-- CONTORNO TRICOLOR -->
      <path d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none" stroke="url(#acento)" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"
        pathLength="100" stroke-dasharray="22 78">
        <animate attributeName="stroke-dashoffset"
          from="0" to="-100" dur="4s" repeatCount="indefinite"/>
      </path>

      <!-- DESTELLO BLANCO -->
      <path d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none" stroke="#FFFFFF" stroke-width="3"
        pathLength="100" stroke-dasharray="8 92">
        <animate attributeName="stroke-dashoffset"
          from="0" to="-100" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- FIRMA INFERIOR DERECHA -->
  <text class="mono" x="940" y="288"
        text-anchor="end" font-size="10"
        letter-spacing="1" fill="#586575">
    CÓDIGO · SEGURIDAD · INNOVACIÓN
  </text>

  <circle cx="952" cy="284" r="3" fill="#22C55E">
    <animate attributeName="opacity"
      values="1;.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

</svg>
