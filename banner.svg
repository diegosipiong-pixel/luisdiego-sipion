
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 300"
     width="1000"
     height="300"
     role="img"
     aria-labelledby="titulo descripcion">

  <title id="titulo">Luis Diego Sipion Galvez</title>
  <desc id="descripcion">Ingeniería de Software, Inteligencia Artificial y Ciberseguridad</desc>

  <defs>
    <!-- PALETA DE COLORES -->
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="52%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="cuboSuperior" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#45B7F5"/>
      <stop offset="100%" stop-color="#1765C5"/>
    </linearGradient>

    <linearGradient id="cuboIzquierdo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2456D9"/>
      <stop offset="100%" stop-color="#272E9E"/>
    </linearGradient>

    <linearGradient id="cuboDerecho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#29C6DC"/>
      <stop offset="100%" stop-color="#1689B5"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="luzAmbiental">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <!-- CUADRÍCULA DEL FONDO -->
    <pattern id="cuadricula" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#FFFFFF"
            stroke-opacity=".025"
            stroke-width="1"/>
    </pattern>

    <!-- RECORTE DEL BANNER -->
    <clipPath id="marco">
      <rect width="1000" height="300" rx="18"/>
    </clipPath>

    <!-- RECORTE DEL CUBO -->
    <clipPath id="recorteCubo">
      <path d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"/>
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: 'Segoe UI', Ubuntu, Arial, sans-serif;
    }

    .mono {
      font-family: 'SFMono-Regular', Consolas, monospace;
    }

    /* ANIMACIÓN FLOTANTE DEL CUBO */
    .cubo-flotante {
      animation: flotar 5s ease-in-out infinite;
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* ANIMACIÓN DE LA LUZ */
    .luz {
      animation: recorrido 4s linear infinite;
    }

    .nucleo-luz {
      animation: recorrido 4s linear infinite;
    }

    @keyframes recorrido {
      to { stroke-dashoffset: -100; }
    }

    /* PARPADEO DEL CURSOR */
    .cursor {
      animation: parpadear 1s steps(1) infinite;
    }

    @keyframes parpadear {
      50% { opacity: 0; }
    }

    /* APARICIÓN DE LA LÍNEA */
    .linea {
      transform-origin: left;
      animation: revelar 1.2s ease-out both;
    }

    @keyframes revelar {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    /* BRILLO SUAVE */
    .brillo-suave {
      animation: resplandor 4s ease-in-out infinite;
    }

    @keyframes resplandor {
      0%, 100% { opacity: .45; }
      50% { opacity: .9; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- FONDO -->
  <g clip-path="url(#marco)">
    <rect width="1000" height="300" fill="#0B0F17"/>
    <rect width="1000" height="300" fill="url(#cuadricula)"/>

    <circle cx="800" cy="150" r="260" fill="url(#luzAmbiental)"/>

    <rect x=".75" y=".75"
          width="998.5" height="298.5"
          rx="17.5"
          fill="none"
          stroke="#FFFFFF"
          stroke-opacity=".09"
          stroke-width="1.5"/>
  </g>

  <!-- CONTENIDO PRINCIPAL -->
  <g class="sans">

    <!-- IDENTIFICADOR -->
    <text x="72" y="70"
          class="mono"
          font-size="13"
          letter-spacing="3"
          fill="#22D3EE">
      INGENIERÍA DE SOFTWARE
    </text>

    <!-- NOMBRE -->
    <text x="70" y="130"
          font-size="48"
          font-weight="700"
          letter-spacing="-1.5"
          fill="#F1F5F9">
      Luis Diego
    </text>

    <text x="72" y="165"
          font-size="27"
          font-weight="400"
          letter-spacing="2"
          fill="#AAB7C7">
      SIPION GALVEZ
    </text>

    <!-- LÍNEA DE ACENTO -->
    <rect class="linea"
          x="72" y="185"
          width="100" height="3"
          rx="2"
          fill="url(#acento)"/>

    <!-- ESPECIALIDADES -->
    <g font-size="14" fill="#C5CEDA">
      <text x="72" y="221">Desarrollo de Software</text>
      <circle cx="231" cy="216" r="2.5" fill="#3B82F6"/>

      <text x="247" y="221">Inteligencia Artificial</text>
      <circle cx="410" cy="216" r="2.5" fill="#3B82F6"/>

      <text x="426" y="221">Ciberseguridad</text>
    </g>

    <!-- UBICACIÓN -->
    <g transform="translate(72 250)">
      <circle cx="5" cy="0" r="4"
              fill="none"
              stroke="#64748B"
              stroke-width="1.4"/>

      <circle cx="5" cy="0" r="1.5" fill="#22D3EE"/>

      <text x="17" y="4"
            class="mono"
            font-size="12"
            fill="#8491A3">
        Lima, Perú
      </text>
    </g>

    <!-- ESTADO ACTUAL -->
    <g transform="translate(72 276)">
      <circle cx="4" cy="0" r="3" fill="#22C55E"/>

      <text x="15" y="4"
            class="mono"
            font-size="10"
            letter-spacing="1"
            fill="#64748B">
        CONSTRUYENDO EL FUTURO
      </text>
    </g>

  </g>

  <!-- DIVISOR -->
  <path d="M610 48 V252"
        stroke="#FFFFFF"
        stroke-opacity=".09"
        stroke-width="1"/>

  <!-- CUBO TRIDIMENSIONAL -->
  <g transform="translate(690 48) scale(0.42)">
    <g class="cubo-flotante">

      <!-- CARAS DEL CUBO -->
      <path d="M257 17 L490 145 L257 273 L22 145 Z"
            fill="url(#cuboSuperior)"/>

      <path d="M22 145 L257 273 L257 495 L22 369 Z"
            fill="url(#cuboIzquierdo)"/>

      <path d="M490 145 L257 273 L257 495 L490 369 Z"
            fill="url(#cuboDerecho)"/>

      <!-- SÍMBOLO BLANCO -->
      <g clip-path="url(#recorteCubo)">

        <g fill="none"
           stroke="#FFFFFF"
           stroke-width="27"
           stroke-linecap="round"
           stroke-linejoin="round">

          <path d="M108 83 L219 145"/>
          <path d="M404 83 L294 145"/>

        </g>

        <ellipse cx="257" cy="163"
                 rx="59" ry="34"
                 fill="#FFFFFF"/>

        <ellipse cx="126" cy="313"
                 rx="32" ry="56"
                 transform="rotate(-28 126 313)"
                 fill="#FFFFFF"/>

        <path d="M145 334 L257 398"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="25"
              stroke-linecap="round"/>

        <ellipse cx="387" cy="313"
                 rx="32" ry="56"
                 transform="rotate(28 387 313)"
                 fill="#FFFFFF"/>

        <path d="M367 334 L257 398"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="25"
              stroke-linecap="round"/>

      </g>

      <!-- HALO DE LUZ -->
      <path
        d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none"
        stroke="#22D3EE"
        stroke-width="30"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity=".18"
        pathLength="100"
        stroke-dasharray="22 78"
        class="luz"/>

      <!-- LUZ TRICOLOR -->
      <path
        d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none"
        stroke="url(#neon)"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
        pathLength="100"
        stroke-dasharray="22 78"
        class="luz"/>

      <!-- BRILLO CENTRAL -->
      <path
        d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        pathLength="100"
        stroke-dasharray="8 92"
        class="nucleo-luz"/>

    </g>
  </g>

  <!-- FIRMA TECNOLÓGICA -->
  <text x="850" y="270"
        class="mono"
        font-size="10"
        letter-spacing="2"
        text-anchor="middle"
        fill="#64748B">
    CREAR · PROTEGER · INNOVAR
  </text>

  <circle cx="950" cy="266" r="3"
          fill="#22D3EE"
          class="brillo-suave"/>

</svg>
