
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 300"
     width="1000" height="300"
     role="img"
     aria-labelledby="t d">

  <title id="t">Luis Diego Sipion Galvez</title>
  <desc id="d">Ingeniería de Software, Inteligencia Artificial y Ciberseguridad</desc>

  <defs>
    <!-- DEGRADADO PRINCIPAL -->
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="g1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="g2">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- CARAS DEL CUBO -->
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1685D5"/>
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#174BD9"/>
      <stop offset="100%" stop-color="#3535C5"/>
    </linearGradient>

    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28C7DF"/>
      <stop offset="100%" stop-color="#35B6D0"/>
    </linearGradient>

    <!-- LUZ TRICOLOR -->
    <linearGradient id="neonGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- FONDO -->
    <pattern id="dots" width="24" height="24"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1000" height="300" rx="18"/>
    </clipPath>

    <!-- RECORTE DEL SÍMBOLO DEL CUBO -->
    <clipPath id="cubeClip">
      <path d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"/>
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .typed {
      font-size: 22px;
      fill: #C9D1D9;
    }

    .blink {
      animation: bl 1s steps(1,end) infinite;
    }

    @keyframes bl {
      50% { opacity: 0; }
    }

    .grow {
      animation: gr 1.6s ease-out forwards;
      transform-origin: 64px 0;
      transform: scaleX(0);
    }

    @keyframes gr {
      to { transform: scaleX(1); }
    }

    @keyframes r0 {
      0% { width: 0; animation-timing-function: steps(38,end); }
      12.67%, 26.67% {
        width: 509.4px;
        animation-timing-function: steps(38,end);
      }
      31.67%, 100% { width: 0; }
    }

    @keyframes c0 {
      0% {
        transform: translateX(0);
        opacity: 1;
        animation-timing-function: steps(38,end);
      }
      12.67%, 26.67% {
        transform: translateX(509.4px);
        opacity: 1;
        animation-timing-function: steps(38,end);
      }
      31.67% {
        transform: translateX(0);
        opacity: 1;
      }
      31.68%, 100% {
        transform: translateX(0);
        opacity: 0;
      }
    }

    .r0 { animation: r0 12s infinite; }
    .c0 { animation: c0 12s infinite; }

    @keyframes r1 {
      0%, 33.33% {
        width: 0;
        animation-timing-function: steps(36,end);
      }
      46%, 60% {
        width: 482.8px;
        animation-timing-function: steps(36,end);
      }
      65%, 100% { width: 0; }
    }

    @keyframes c1 {
      0%, 33.33% {
        transform: translateX(0);
        opacity: 0;
        animation-timing-function: steps(36,end);
      }
      33.34% {
        transform: translateX(0);
        opacity: 1;
        animation-timing-function: steps(36,end);
      }
      46%, 60% {
        transform: translateX(482.8px);
        opacity: 1;
        animation-timing-function: steps(36,end);
      }
      65% {
        transform: translateX(0);
        opacity: 1;
      }
      65.01%, 100% {
        transform: translateX(0);
        opacity: 0;
      }
    }

    .r1 { animation: r1 12s infinite; }
    .c1 { animation: c1 12s infinite; }

    @keyframes r2 {
      0%, 66.67% {
        width: 0;
        animation-timing-function: steps(35,end);
      }
      79.33%, 93.33% {
        width: 469.5px;
        animation-timing-function: steps(35,end);
      }
      98.33%, 100% { width: 0; }
    }

    @keyframes c2 {
      0%, 66.67% {
        transform: translateX(0);
        opacity: 0;
        animation-timing-function: steps(35,end);
      }
      66.68% {
        transform: translateX(0);
        opacity: 1;
        animation-timing-function: steps(35,end);
      }
      79.33%, 93.33% {
        transform: translateX(469.5px);
        opacity: 1;
        animation-timing-function: steps(35,end);
      }
      98.33% {
        transform: translateX(0);
        opacity: 1;
      }
      98.34%, 100% {
        transform: translateX(0);
        opacity: 0;
      }
    }

    .r2 { animation: r2 12s infinite; }
    .c2 { animation: c2 12s infinite; }

    .cube-float {
      animation: cubeFloat 4s ease-in-out infinite;
    }

    @keyframes cubeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .tech-glow {
      animation: techPulse 3s ease-in-out infinite;
    }

    @keyframes techPulse {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }

    .circuit {
      stroke-dasharray: 5 8;
      animation: circuitMove 8s linear infinite;
    }

    @keyframes circuitMove {
      to { stroke-dashoffset: -52; }
    }

    .shield-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: shieldPulse 3s ease-in-out infinite;
    }

    @keyframes shieldPulse {
      0%, 100% { opacity: .65; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .grow { transform: none; }
    }
  </style>

  <!-- FONDO -->
  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="#0D1117"/>
    <rect width="1000" height="300" fill="url(#dots)"/>

    <circle cx="820" cy="60" r="240" fill="url(#g1)">
      <animate attributeName="cx"
               values="820;760;820"
               dur="14s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="120" cy="300" r="260" fill="url(#g2)">
      <animate attributeName="cy"
               values="300;250;300"
               dur="11s"
               repeatCount="indefinite"/>
    </circle>

    <rect x=".75" y=".75"
          width="998.5" height="298.5"
          rx="17.5"
          fill="none"
          stroke="#30363D"
          stroke-width="1.5"/>

    <!-- CIRCUITOS DECORATIVOS DEL FONDO -->
    <g fill="none"
       stroke="#22D3EE"
       stroke-width="1.3"
       opacity=".16"
       class="circuit">

      <path d="M570 35 H650 V55 H705"/>
      <path d="M610 75 H675 V95 H730"/>
      <path d="M560 245 H630 V225 H690"/>
      <path d="M700 35 V20 H740"/>
      <path d="M690 270 H740 V250 H760"/>

      <circle cx="650" cy="35" r="3" fill="#22D3EE"/>
      <circle cx="705" cy="55" r="3" fill="#22D3EE"/>
      <circle cx="675" cy="75" r="3" fill="#22D3EE"/>
      <circle cx="630" cy="245" r="3" fill="#22D3EE"/>
    </g>
  </g>

  <!-- PRESENTACIÓN -->
  <text class="mono"
        x="64" y="72"
        font-size="18"
        fill="#8B949E">
    hola, soy
  </text>

  <text class="sans"
        x="62" y="134"
        font-size="60"
        font-weight="700"
        fill="#F0F6FC"
        letter-spacing="-1">
    Luis Diego Sipion Galvez
  </text>

  <!-- LÍNEA ANIMADA -->
  <rect class="grow"
        x="64" y="152"
        width="150" height="4"
        rx="2"
        fill="url(#bar)"/>

  <!-- TEXTO ANIMADO -->
  <text class="mono"
        x="64" y="214"
        font-size="22"
        fill="#8B5CF6">
    ❯
  </text>

  <clipPath id="clip0">
    <rect class="r0"
          x="104" y="190"
          width="509.4" height="34"/>
  </clipPath>

  <text class="mono typed"
        x="104" y="214"
        clip-path="url(#clip0)">
    ingeniería de software IA y Ciberseguridad
  </text>

  <g class="c0">
    <rect class="blink"
          x="106" y="195"
          width="11" height="24"
          fill="#22D3EE"/>
  </g>

  <clipPath id="clip1">
    <rect class="r1"
          x="104" y="190"
          width="482.8" height="34"/>
  </clipPath>

  <text class="mono typed"
        x="104" y="214"
        clip-path="url(#clip1)">
    web · bases de datos · deep learning
  </text>

  <g class="c1" opacity="0">
    <rect class="blink"
          x="106" y="195"
          width="11" height="24"
          fill="#22D3EE"/>
  </g>

  <clipPath id="clip2">
    <rect class="r2"
          x="104" y="190"
          width="469.5" height="34"/>
  </clipPath>

  <text class="mono typed"
        x="104" y="214"
        clip-path="url(#clip2)">
    buscando prácticas preprofesionales
  </text>

  <g class="c2" opacity="0">
    <rect class="blink"
          x="106" y="195"
          width="11" height="24"
          fill="#22D3EE"/>
  </g>

  <!-- ===================================== -->
  <!-- ELEMENTOS DE INGENIERÍA Y SEGURIDAD -->
  <!-- ===================================== -->

  <!-- ICONO DE CÓDIGO -->
  <g transform="translate(650 105)" class="tech-glow">
    <rect x="0" y="0"
          width="72" height="62"
          rx="10"
          fill="#111D2B"
          stroke="#22D3EE"
          stroke-opacity=".45"/>

    <path d="M25 20 L15 31 L25 42"
          fill="none"
          stroke="#22D3EE"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M47 20 L57 31 L47 42"
          fill="none"
          stroke="#8B5CF6"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M40 17 L32 45"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.5"
          stroke-linecap="round"/>
  </g>

  <!-- ICONO DE CIBERSEGURIDAD: ESCUDO Y CANDADO -->
  <g transform="translate(685 175)" class="shield-pulse">
    <path d="M35 0 L65 12 V35
             C65 54 52 68 35 77
             C18 68 5 54 5 35 V12 Z"
          fill="#111D2B"
          stroke="#8B5CF6"
          stroke-width="2.5"/>

    <path d="M35 8 L57 17 V35
             C57 49 47 59 35 67
             C23 59 13 49 13 35 V17 Z"
          fill="none"
          stroke="#22D3EE"
          stroke-width="1.5"
          opacity=".8"/>

    <!-- CANDADO -->
    <rect x="25" y="32"
          width="20" height="17"
          rx="3"
          fill="#22D3EE"/>

    <path d="M29 32 V26
             C29 18 41 18 41 26 V32"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3"
          stroke-linecap="round"/>

    <circle cx="35" cy="40" r="2.2" fill="#0D1117"/>
    <path d="M35 42 V45"
          stroke="#0D1117"
          stroke-width="2"/>
  </g>

  <!-- NODOS DE RED -->
  <g transform="translate(735 35)"
     fill="none"
     stroke="#22D3EE"
     stroke-width="1.5"
     opacity=".7">

    <path d="M0 20 L22 0 L44 20 L22 40 Z"/>
    <path d="M22 0 V40 M0 20 H44"/>

    <circle cx="22" cy="0" r="3" fill="#22D3EE"/>
    <circle cx="0" cy="20" r="3" fill="#22D3EE"/>
    <circle cx="44" cy="20" r="3" fill="#22D3EE"/>
    <circle cx="22" cy="40" r="3" fill="#22D3EE"/>
    <circle cx="22" cy="20" r="4" fill="#8B5CF6"/>
  </g>

  <!-- CUBO 3D -->
  <g transform="translate(770 66) scale(0.35)">
    <g class="cube-float">

      <!-- CARAS -->
      <path d="M257 17 L490 145 L257 273 L22 145 Z"
            fill="url(#cubeTop)"/>

      <path d="M22 145 L257 273 L257 495 L22 369 Z"
            fill="url(#cubeLeft)"/>

      <path d="M490 145 L257 273 L257 495 L490 369 Z"
            fill="url(#cubeRight)"/>

      <!-- SÍMBOLO BLANCO -->
      <g clip-path="url(#cubeClip)">

        <g fill="none"
           stroke="#FFFFFF"
           stroke-width="27"
           stroke-linecap="round"
           stroke-linejoin="round">

          <path d="M108 83 L219 145"/>
          <path d="M404 83 L294 145"/>

        </g>

        <ellipse cx="257" cy="163"
                 rx="59" ry="34"
                 fill="#FFFFFF"/>

        <ellipse cx="126" cy="313"
                 rx="32" ry="56"
                 transform="rotate(-28 126 313)"
                 fill="#FFFFFF"/>

        <path d="M145 334 L257 398"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="25"
              stroke-linecap="round"/>

        <ellipse cx="387" cy="313"
                 rx="32" ry="56"
                 transform="rotate(28 387 313)"
                 fill="#FFFFFF"/>

        <path d="M367 334 L257 398"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="25"
              stroke-linecap="round"/>

      </g>

      <!-- HALO DE LUZ -->
      <path
        d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none"
        stroke="#22D3EE"
        stroke-width="30"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity=".22"
        pathLength="100"
        stroke-dasharray="22 78">

        <animate
          attributeName="stroke-dashoffset"
          from="0"
          to="-100"
          dur="4s"
          repeatCount="indefinite"/>
      </path>

      <!-- LUZ TRICOLOR -->
      <path
        d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none"
        stroke="url(#neonGradient)"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
        pathLength="100"
        stroke-dasharray="22 78">

        <animate
          attributeName="stroke-dashoffset"
          from="0"
          to="-100"
          dur="4s"
          repeatCount="indefinite"/>
      </path>

      <!-- BRILLO INTERIOR -->
      <path
        d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        pathLength="100"
        stroke-dasharray="8 92">

        <animate
          attributeName="stroke-dashoffset"
          from="0"
          to="-100"
          dur="4s"
          repeatCount="indefinite"/>
      </path>

    </g>
  </g>

  <!-- ETIQUETAS TECNOLÓGICAS -->
  <g class="mono" font-size="10" font-weight="600">

    <!-- SOFTWARE -->
    <g transform="translate(64 244)">
      <rect width="166" height="25"
            rx="6"
            fill="#111D2B"
            stroke="#22D3EE"
            stroke-opacity=".45"/>

      <circle cx="13" cy="12.5" r="3"
              fill="#22D3EE"/>

      <text x="23" y="16"
            fill="#C9D1D9"
            letter-spacing=".5">
        SOFTWARE ENGINEERING
      </text>
    </g>

    <!-- CIBERSEGURIDAD -->
    <g transform="translate(240 244)">
      <rect width="139" height="25"
            rx="6"
            fill="#111D2B"
            stroke="#8B5CF6"
            stroke-opacity=".55"/>

      <circle cx="13" cy="12.5" r="3"
              fill="#A855F7"/>

      <text x="23" y="16"
            fill="#C9D1D9"
            letter-spacing=".5">
        CYBERSECURITY
      </text>
    </g>

    <!-- IA -->
    <g transform="translate(389 244)">
      <rect width="91" height="25"
            rx="6"
            fill="#111D2B"
            stroke="#3B82F6"
            stroke-opacity=".55"/>

      <circle cx="13" cy="12.5" r="3"
              fill="#3B82F6"/>

      <text x="23" y="16"
            fill="#C9D1D9"
            letter-spacing=".5">
        AI / ML
      </text>
    </g>

    <!-- TERMINAL -->
    <g transform="translate(490 244)">
      <rect width="105" height="25"
            rx="6"
            fill="#111D2B"
            stroke="#22D3EE"
            stroke-opacity=".35"/>

      <circle cx="13" cy="12.5" r="3"
              fill="#22D3EE"/>

      <text x="23" y="16"
            fill="#C9D1D9"
            letter-spacing=".5">
        DEVELOPER
      </text>
    </g>

  </g>

  <!-- UBICACIÓN -->
  <text class="mono"
        x="64" y="288"
        font-size="13"
        fill="#6E7681">
    Lima, Perú
  </text>

  <!-- DETALLE INFERIOR -->
  <text class="mono"
        x="936" y="288"
        font-size="10"
        fill="#4B5563"
        text-anchor="end">
    SYSTEM ONLINE
  </text>

  <circle cx="946" cy="284"
          r="3"
          fill="#22C55E">
    <animate attributeName="opacity"
             values="1;.3;1"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

</svg>
