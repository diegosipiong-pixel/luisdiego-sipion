
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 300"
     width="1000"
     height="300"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Luis Diego Sipion Galvez</title>
  <desc id="desc">Software Engineering, Artificial Intelligence and Cybersecurity</desc>

  <defs>
    <!-- PALETA -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="52%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#45B7F5"/>
      <stop offset="100%" stop-color="#1765C5"/>
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2456D9"/>
      <stop offset="100%" stop-color="#272E9E"/>
    </linearGradient>

    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#29C6DC"/>
      <stop offset="100%" stop-color="#1689B5"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="ambient">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#FFFFFF"
            stroke-opacity=".025"
            stroke-width="1"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1000" height="300" rx="18"/>
    </clipPath>

    <clipPath id="cubeClip">
      <path d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"/>
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: 'Segoe UI', Ubuntu, Arial, sans-serif;
    }

    .mono {
      font-family: 'SFMono-Regular', Consolas, monospace;
    }

    .cube-float {
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .light {
      animation: travel 4s linear infinite;
    }

    .light-core {
      animation: travel 4s linear infinite;
    }

    @keyframes travel {
      to { stroke-dashoffset: -100; }
    }

    .cursor {
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .line {
      transform-origin: left;
      animation: reveal 1.2s ease-out both;
    }

    @keyframes reveal {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    .soft-glow {
      animation: glow 4s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { opacity: .45; }
      50% { opacity: .9; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- FONDO -->
  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="#0B0F17"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <circle cx="800" cy="150" r="260" fill="url(#ambient)"/>

    <rect x=".75" y=".75"
          width="998.5" height="298.5"
          rx="17.5"
          fill="none"
          stroke="#FFFFFF"
          stroke-opacity=".09"
          stroke-width="1.5"/>
  </g>

  <!-- CONTENIDO PRINCIPAL -->
  <g class="sans">

    <!-- IDENTIFICADOR -->
    <text x="72" y="70"
          class="mono"
          font-size="13"
          letter-spacing="3"
          fill="#22D3EE">
      SOFTWARE ENGINEERING
    </text>

    <!-- NOMBRE -->
    <text x="70" y="130"
          font-size="48"
          font-weight="700"
          letter-spacing="-1.5"
          fill="#F1F5F9">
      Luis Diego
    </text>

    <text x="72" y="165"
          font-size="27"
          font-weight="400"
          letter-spacing="2"
          fill="#AAB7C7">
      SIPION GALVEZ
    </text>

    <!-- LÍNEA DE ACENTO -->
    <rect class="line"
          x="72" y="185"
          width="100" height="3"
          rx="2"
          fill="url(#accent)"/>

    <!-- ESPECIALIDADES -->
    <g font-size="14" fill="#C5CEDA">
      <text x="72" y="221">Software Development</text>
      <circle cx="231" cy="216" r="2.5" fill="#3B82F6"/>

      <text x="247" y="221">Artificial Intelligence</text>
      <circle cx="410" cy="216" r="2.5" fill="#3B82F6"/>

      <text x="426" y="221">Cybersecurity</text>
    </g>

    <!-- UBICACIÓN -->
    <g transform="translate(72 250)">
      <circle cx="5" cy="0" r="4"
              fill="none"
              stroke="#64748B"
              stroke-width="1.4"/>

      <circle cx="5" cy="0" r="1.5" fill="#22D3EE"/>

      <text x="17" y="4"
            class="mono"
            font-size="12"
            fill="#8491A3">
        Lima, Perú
      </text>
    </g>

    <!-- ESTADO -->
    <g transform="translate(72 276)">
      <circle cx="4" cy="0" r="3" fill="#22C55E"/>

      <text x="15" y="4"
            class="mono"
            font-size="10"
            letter-spacing="1"
            fill="#64748B">
        BUILDING THE FUTURE
      </text>
    </g>

  </g>

  <!-- DIVISOR -->
  <path d="M610 48 V252"
        stroke="#FFFFFF"
        stroke-opacity=".09"
        stroke-width="1"/>

  <!-- CUBO 3D -->
  <g transform="translate(690 48) scale(0.42)">
    <g class="cube-float">

      <!-- CARAS -->
      <path d="M257 17 L490 145 L257 273 L22 145 Z"
            fill="url(#cubeTop)"/>

      <path d="M22 145 L257 273 L257 495 L22 369 Z"
            fill="url(#cubeLeft)"/>

      <path d="M490 145 L257 273 L257 495 L490 369 Z"
            fill="url(#cubeRight)"/>

      <!-- SÍMBOLO BLANCO -->
      <g clip-path="url(#cubeClip)">

        <g fill="none"
           stroke="#FFFFFF"
           stroke-width="27"
           stroke-linecap="round"
           stroke-linejoin="round">

          <path d="M108 83 L219 145"/>
          <path d="M404 83 L294 145"/>

        </g>

        <ellipse cx="257" cy="163"
                 rx="59" ry="34"
                 fill="#FFFFFF"/>

        <ellipse cx="126" cy="313"
                 rx="32" ry="56"
                 transform="rotate(-28 126 313)"
                 fill="#FFFFFF"/>

        <path d="M145 334 L257 398"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="25"
              stroke-linecap="round"/>

        <ellipse cx="387" cy="313"
                 rx="32" ry="56"
                 transform="rotate(28 387 313)"
                 fill="#FFFFFF"/>

        <path d="M367 334 L257 398"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="25"
              stroke-linecap="round"/>

      </g>

      <!-- HALO DE LUZ -->
      <path
        d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none"
        stroke="#22D3EE"
        stroke-width="30"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity=".18"
        pathLength="100"
        stroke-dasharray="22 78"
        class="light"/>

      <!-- LUZ TRICOLOR -->
      <path
        d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none"
        stroke="url(#neon)"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
        pathLength="100"
        stroke-dasharray="22 78"
        class="light"/>

      <!-- BRILLO CENTRAL -->
      <path
        d="M257 17 L490 145 L490 369 L257 495 L22 369 L22 145 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        pathLength="100"
        stroke-dasharray="8 92"
        class="light-core"/>

    </g>
  </g>

  <!-- FIRMA TECNOLÓGICA -->
  <text x="850" y="270"
        class="mono"
        font-size="10"
        letter-spacing="2"
        text-anchor="middle"
        fill="#64748B">
    CODE · SECURE · INNOVATE
  </text>

  <circle cx="950" cy="266" r="3"
          fill="#22D3EE"
          class="soft-glow"/>

</svg>
